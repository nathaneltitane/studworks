version: '{branch}.{build}'
skip_tags: true
image:
- Ubuntu1604
- macOS
- Visual Studio 2022
configuration: Release
platform: x64

environment:
  GITHUB_TOKEN:
    secure: 1b68GmbnYxE3HFlAGgmNv1KDB9XKL8eVInl/Q5/AjJ0FbrmAsMf/DJ44qOsB7rsV

matrix:
  fast_finish: true

for:
  -
    matrix:
      only:
        - image: Visual Studio 2022
        
    before_build:
    - call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
    - set PATH=C:\Qt\6.9\msvc2022_64\bin;%PATH%
    - ps: $env:VERSION = (Select-String -Path source\application\sw_global.h -Pattern 'SW_VERSION_TEXT "([0-9-]+)"').Matches[0].Groups[1].Value
    - qmake -v
    - qmake -tp vc

    build:
      project: studworks.vcxproj
      verbosity: minimal

    after_build:
    - 7z a symbols.zip build/release/studworks.exe build/release/studworks.pdb
    - mkdir appdir
    - copy build\release\studworks.exe appdir
    - copy documentation\README.md appdir\readme.txt
    - appveyor DownloadFile https://library.ldraw.org/library/updates/complete.zip -FileName appdir\library.bin
    - appveyor DownloadFile https://github.com/leozide/povray/releases/download/build1/povconsole32-sse2.exe -FileName appdir\povconsole32-sse2.exe
    - windeployqt appdir\studworks.exe
    - copy packaging\studworks.nsi .
    - copy packaging\setup.ico .
    - 'copy "%VCINSTALLDIR%Redist\MSVC\v143\vc_redist.x64.exe" appdir\vc_redist.x64.exe'
    - '"C:\Program Files (x86)\NSIS\makensis.exe" /V4 /DX64 "/XOutFile StudWorks-Windows-%VERSION%-x64.exe" studworks.nsi'
    - set TRAVIS_TAG=%APPVEYOR_REPO_TAG_NAME%
    - set TRAVIS_REPO_SLUG=%APPVEYOR_REPO_NAME%
    - set TRAVIS_COMMIT=%APPVEYOR_REPO_COMMIT%
    - set UPLOADTOOL_ISPRERELEASE=1
    - appveyor DownloadFile https://github.com/probonopd/uploadtool/raw/master/upload.sh
    - if not defined APPVEYOR_PULL_REQUEST_NUMBER (bash upload.sh StudWorks*.exe)

    artifacts:
    - path: symbols.zip
      name: symbols
    - path: StudWorks-Windows-$(VERSION)-x64.exe
      name: studworks
      
  -
    matrix:
      only:
        - image: Ubuntu1604
        
    install:
      - sudo apt-get -y install libqt5opengl5-dev libxcb-xinerama0
      
    before_build:
      - export PATH=$HOME/Qt/5.15/gcc_64/bin:$PATH
      - export TRAVIS_TAG=$APPVEYOR_REPO_TAG_NAME
      - export TRAVIS_REPO_SLUG=$APPVEYOR_REPO_NAME
      - export TRAVIS_COMMIT=$APPVEYOR_REPO_COMMIT
    
    build_script:
      - appveyor DownloadFile https://library.ldraw.org/library/updates/complete.zip -FileName library.bin
      - qmake PREFIX=/usr
      - make
      
    after_build:
      - make install INSTALL_ROOT=AppDir
      - cp platform/studworks.desktop AppDir/studworks.desktop
      - cp resources/icons/256x256/apps/studworks.png AppDir/studworks.png
      - cp packaging/AppRun AppDir
      - chmod a+x AppDir/AppRun
      - appveyor DownloadFile https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
      - chmod a+x linuxdeployqt*.AppImage 
      - unset QTDIR; unset QT_PLUGIN_PATH ; unset LD_LIBRARY_PATH
      - '[[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]] && export VERSION="${BASH_REMATCH[1]}"'
      - ./linuxdeployqt*.AppImage ./AppDir/usr/share/applications/*.desktop -bundle-non-qt-libs
      - ./linuxdeployqt*.AppImage --appimage-extract
      - export PATH=$(readlink -f ./squashfs-root/usr/bin/):$PATH
      - ./squashfs-root/usr/bin/appimagetool AppDir/
      - mv ./StudWorks-$VERSION-x86_64.AppImage ./StudWorks-Linux-$VERSION-x86_64.AppImage 
      - 'curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/nathaneltitane/studworks/commits/main -o repo.txt'
      - 'export REMOTE=$(grep -Po ''(?<=: \")(([a-z0-9])\w+)(?=\")'' -m 1 repo.txt)'
      - export LOCAL=$(git rev-parse HEAD)
      - export UPLOADTOOL_ISPRERELEASE=1
      - if [[ "$REMOTE" != "$LOCAL" ]]; then echo "Build no longer current. $REMOTE vs $LOCAL - aborting upload."; exit 0; fi;
      - wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
      - bash upload.sh StudWorks*.AppImage*

  -
    matrix:
      only:
        - image: macos

    before_build:
      - export PATH=$HOME/Qt/6.6/macos/bin:$PATH
      - export TRAVIS_TAG=$APPVEYOR_REPO_TAG_NAME
      - export TRAVIS_REPO_SLUG=$APPVEYOR_REPO_NAME
      - export TRAVIS_COMMIT=$APPVEYOR_REPO_COMMIT
      - appveyor DownloadFile https://github.com/leozide/povray/releases/download/build1/povray
      - chmod +x povray
      - appveyor DownloadFile https://library.ldraw.org/library/updates/complete.zip -FileName library.bin
     
    build_script:
      - qmake PREFIX=/usr QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"
      - make
    
    after_build:
      - cd build/release
      - '[[ "$(grep -m 1 SW_VERSION_TEXT ../../source/application/sw_global.h)" =~ \"([0-9-]+)\" ]] && export VERSION="${BASH_REMATCH[1]}"'
      - macdeployqt StudWorks.app -dmg
      - mv StudWorks.dmg StudWorks-macOS-$VERSION-universal.dmg
      - 'curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/nathaneltitane/studworks/commits/main -o repo.txt' 
      - "export REMOTE=$(awk -F'\"' '/\"sha\"[[:space:]]*:/ { print $(NF-1); exit }' repo.txt)"
      - export LOCAL=$(git rev-parse HEAD)
      - export UPLOADTOOL_ISPRERELEASE=1
      - if [[ "$REMOTE" != "$LOCAL" ]]; then echo "Build no longer current. $REMOTE vs $LOCAL - aborting upload."; exit 0; fi;
      - appveyor DownloadFile https://github.com/probonopd/uploadtool/raw/master/upload.sh
      - bash upload.sh StudWorks*.dmg*
