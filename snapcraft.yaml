name: studworks
base: core18
adopt-info: studworks
version: '2026-10-29'
grade: stable
confinement: strict

apps:
  studworks:
    common-id: io.github.nathaneltitane.StudWorks
    command: studworks
    plugs:
      - home
      - opengl
      - network
    extensions:
      - kde-neon

parts:
  studworks:
    plugin: qmake
    build-packages:
      - qtbase5-dev
      - qttools5-dev-tools
      - libqt5opengl5-dev
      - zlib1g-dev
    stage-packages:
      - libqt5opengl5
      - libqt5gui5
      - libqt5concurrent5
      - libqt5printsupport5
      - libqt5xml5
    source: https://github.com/nathaneltitane/studworks/archive/refs/tags/2026-10-29.tar.gz
    parse-info: [usr/share/metainfo/io.github.nathaneltitane.StudWorks.appdata.xml]
