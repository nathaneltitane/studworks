name: studworks
base: core18
adopt-info: studworks
version: '2026-10-29'
grade: stable
confinement: strict

apps:
  studworks:
    common-id: io.github.nathaneltitane.StudWorks
    command: studworks
    plugs:
      - home
      - opengl
      - network
    extensions:
      - kde-neon

parts:
  studworks:
    plugin: qmake
    build-packages:
      - qtbase5-dev
      - qttools5-dev-tools
      - libqt5opengl5-dev
      - zlib1g-dev
    stage-packages:
      - libqt5opengl5
      - libqt5gui5
      - libqt5concurrent5
      - libqt5printsupport5
      - libqt5xml5
    source: https://github.com/nathaneltitane/studworks/archive/refs/tags/2026-10-29.tar.gz
    parse-info: [usr/share/metainfo/io.github.nathaneltitane.StudWorks.appdata.xml]
  library:
    source: .
    plugin: dump
    build-packages:
      - curl
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/studworks
      [ -s library.bin ] || curl -fsSL https://library.ldraw.org/library/updates/complete.zip -o library.bin
      cp library.bin $SNAPCRAFT_PART_INSTALL/usr/share/studworks/library.bin
